services:
  vault:
    image: hashicorp/vault:1.18
    ports: ["8200:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: ["IPC_LOCK"]
    command: vault server -dev
    healthcheck: { test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8200/v1/sys/health"], interval: 10s, timeout: 5s, retries: 10 }

  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: postgres
      AUTH_DB_PASS: ${AUTH_DB_PASS}
      LINKS_DB_PASS: ${LINKS_DB_PASS}
      ANALYTICS_DB_PASS: ${ANALYTICS_DB_PASS}
    volumes:
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 10s, timeout: 5s, retries: 10 }

  redis:
    image: docker.io/library/redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 10 }

  auth-server:
    build: { context: ., dockerfile: auth-server/Dockerfile }
    depends_on: { vault: {condition: service_healthy}, postgres: {condition: service_healthy} }
    ports: ["9000:9000"]
    env_file: .env

  link-service:
    build: { context: ., dockerfile: link-service/Dockerfile }
    depends_on: { auth-server: {condition: service_started}, postgres: {condition: service_healthy}, vault: {condition: service_healthy} }
    env_file: .env

  analytics-service:
    build: { context: ., dockerfile: analytics-service/Dockerfile }
    depends_on: { auth-server: {condition: service_started}, postgres: {condition: service_healthy}, vault: {condition: service_healthy} }
    env_file: .env

  redirect-service:
    build: { context: ., dockerfile: redirect-service/Dockerfile }
    depends_on: { link-service: {condition: service_started}, analytics-service: {condition: service_started}, redis: {condition: service_healthy}, vault: {condition: service_healthy} }
    env_file: .env

  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    depends_on: { auth-server: {condition: service_started}, link-service: {condition: service_started}, redirect-service: {condition: service_started}, analytics-service: {condition: service_started} }
    ports: ["8080:8080"]
    env_file: .env

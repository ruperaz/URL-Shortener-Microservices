services:
  vault:
    image: docker.io/hashicorp/vault:1.18
    command: vault server -dev
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8200/v1/sys/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      AUTH_DB_PASS: ${AUTH_DB_PASS}
      LINKS_DB_PASS: ${LINKS_DB_PASS}
      ANALYTICS_DB_PASS: ${ANALYTICS_DB_PASS}
    volumes:
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    env_file: .env
    ports:
      - "9000:9000"
    restart: unless-stopped

  link-service:
    build:
      context: .
      dockerfile: link-service/Dockerfile
    env_file: .env
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: analytics-service/Dockerfile
    env_file: .env
    restart: unless-stopped

  redirect-service:
    build:
      context: .
      dockerfile: redirect-service/Dockerfile
    env_file: .env
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    env_file: .env
    ports:
      - "8080:8080"
    restart: unless-stopped
